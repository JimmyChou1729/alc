[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "alc-web"
version = "2.1.0"
description = "Local document jobs and Reader delivery for ALC."
readme = "README.md"
license = "MIT"
authors = [{ name = "ALC" }]
requires-python = ">=3.11"
dependencies = [
  "alc-catalog>=2,<3",
  "ac-jobs>=2.1.0,<3", "ac-llm>=2.1.0,<3", "ac-document>=2.1.0,<3",
  "alc-ocr-proofread>=2,<3", "alc-render>=2,<3", "alc-translate>=2,<3", "alc-companion>=2,<3",
  "fastapi>=0.135,<1", "uvicorn>=0.30,<1", "httpx>=0.28,<1",
  "python-multipart>=0.0.22,<1", "keyring>=25,<26",
]

[project.urls]
Homepage = "https://github.com/tririver/alc"
Repository = "https://github.com/tririver/alc"
Issues = "https://github.com/tririver/alc/issues"

[project.scripts]
alc-web = "alc_web.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/alc_web"]

[tool.hatch.build]
exclude = ["src/alc_web/static/**"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
