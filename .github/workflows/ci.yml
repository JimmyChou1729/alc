name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tag:
    name: Validate formal tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check version and merged commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check-release-tag.py --tag "$RELEASE_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  test:
    needs: release-tag
    if: ${{ !cancelled() && (needs.release-tag.result == 'success' || needs.release-tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install build pytest PyYAML jsonschema Pillow uv
      - name: Read Foundation source lock
        id: foundation
        run: |
          python - <<'PYTHON'
          import json, os
          lock = json.load(open("plugins/alc/skills/alc/scripts/runtime-sources.json"))
          source = next(item for item in lock["sources"] if item["id"] == "foundation")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("repository=" + source["repository"], file=output)
              print("sha=" + source["commit"], file=output)
          PYTHON
      - name: Checkout locked Foundation
        env:
          FOUNDATION_REPOSITORY: ${{ steps.foundation.outputs.repository }}
          FOUNDATION_SHA: ${{ steps.foundation.outputs.sha }}
        run: |
          git clone "$FOUNDATION_REPOSITORY" local/ac-foundation
          git -C local/ac-foundation checkout --detach "$FOUNDATION_SHA"
      - name: Check formal runtime provenance
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/check-release-tag.py --tag "$RELEASE_TAG" --check-pins --foundation-root local/ac-foundation
      - run: AC_FOUNDATION_REPO_ROOT="$PWD/local/ac-foundation" python scripts/check-generated-foundation.py
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run build
      - run: >-
          python -m pip install
          -e local/ac-foundation/packages/ac-jobs
          -e local/ac-foundation/packages/ac-llm
          -e local/ac-foundation/packages/ac-document
          -e local/ac-foundation/packages/ac-proposer-reviewer
          -e packages/alc-catalog
          -e packages/alc-render
          -e packages/alc-ocr-proofread
          -e packages/alc-translate
          -e packages/alc-companion
          -e packages/alc-web
      - run: python -m pytest --import-mode=importlib packages/*/tests tests
      - run: node tests/test_dsh_llm_bridge.mjs
      - run: scripts/build-packages.sh

  auto-tag:
    needs: test
    if: >-
      ${{ !cancelled() && needs.test.result == 'success' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          github.repository == 'tririver/alc' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select merged release PR
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python scripts/auto-release-tag.py candidate)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Checkout release Foundation source
        if: steps.release.outputs.tag != ''
        run: |
          python - <<'PYTHON'
          import json, subprocess
          from pathlib import Path
          lock = json.loads(Path("plugins/alc/skills/alc/scripts/runtime-sources.json").read_text())
          source = next(item for item in lock["sources"] if item["id"] == "foundation")
          if source["repository"] != "https://github.com/tririver/ac-foundation.git":
              raise SystemExit("Release requires upstream Foundation")
          subprocess.run(["git", "clone", source["repository"], "local/ac-foundation"], check=True)
          subprocess.run(["git", "-C", "local/ac-foundation", "checkout", "--detach", source["commit"]], check=True)
          PYTHON
      - name: Validate release before tagging
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          AC_FOUNDATION_REPO_ROOT: ${{ github.workspace }}/local/ac-foundation
        run: |
          python scripts/check-generated-foundation.py
          python scripts/check-release-tag.py --tag "$RELEASE_TAG" --check-pins --foundation-root local/ac-foundation
      # GITHUB_TOKEN tag pushes do not trigger another CI run; validate first.
      - name: Publish immutable version tag
        if: steps.release.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/auto-release-tag.py publish --tag "$RELEASE_TAG"
